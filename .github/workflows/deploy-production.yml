name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      key: ${{ steps.identity.outputs.key }}
      matrix: ${{ steps.test-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '>=22.22.2 <23'
          cache: npm
      - id: identity
        env:
          MODULES_KEY: tms-modules-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'prisma/schema.prisma') }}
        run: echo "key=$MODULES_KEY" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: modules
        with:
          path: node_modules
          key: ${{ steps.identity.outputs.key }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Descobrir todos os testes e distribuir sem grupos vazios
        id: test-matrix
        run: |
          npx vitest list --filesOnly --json > ci-test-files.json
          node .github/scripts/test-matrix.mjs ci-test-files.json >> "$GITHUB_OUTPUT"

  tests:
    name: tests (${{ matrix.id }})
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dependencies.outputs.matrix) }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms
          POSTGRES_DB: tms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tms -d tms_test"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tms:tms@127.0.0.1:5432/tms_test?schema=public
      TMS_CI_TEST_FILES: ${{ toJSON(matrix.files) }}
      TMS_CI_TEST_PART: ${{ matrix.part || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/restore-ci
        with:
          modules-key: ${{ needs.dependencies.outputs.key }}
      - run: npx prisma db push --schema=prisma/schema.prisma
      - run: npm run db:lojas-logistica
      - run: npm run db:rls
      # A selecao exata do config preserva a cobertura, sem filtro por substring.
      - run: npm test

  build:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # O typecheck posterior inclui os validadores gerados por este build.
      TMS_CI_SEPARATE_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/restore-ci
        with:
          modules-key: ${{ needs.dependencies.outputs.key }}
      - run: npm run build
      - name: Preparar standalone e tipos deste commit
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p ci-standalone/.next/static ci-standalone/public
          cp -a .next/standalone/. ci-standalone/
          cp -a .next/static/. ci-standalone/.next/static/
          cp -a public/. ci-standalone/public/
          tar -czf standalone.tgz -C ci-standalone .
          tar -czf next-types.tgz .next/types next-env.d.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-${{ github.sha }}
          path: standalone.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-types-${{ github.sha }}
          path: next-types.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  source-typecheck:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/restore-ci
        with:
          modules-key: ${{ needs.dependencies.outputs.key }}
      - run: npm run typecheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typecheck-state-${{ github.sha }}
          path: tsconfig.tsbuildinfo
          if-no-files-found: error
          retention-days: 2

  typecheck:
    needs: [dependencies, build, source-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/restore-ci
        with:
          modules-key: ${{ needs.dependencies.outputs.key }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: next-types-${{ github.sha }}
      - run: tar -xzf next-types.tgz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: typecheck-state-${{ github.sha }}
      - run: npm run typecheck

  checks:
    if: always()
    needs: [tests, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Exigir suite integral e tipos aprovados
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          TYPES_RESULT: ${{ needs.typecheck.result }}
        run: |
          test "$TESTS_RESULT" = success
          test "$TYPES_RESULT" = success

  image:
    name: image / build
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms
          POSTGRES_DB: tms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tms -d tms_test"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-${{ github.sha }}
      - name: Construir imagem do standalone aprovado
        run: |
          set -euo pipefail
          mkdir ci-runtime
          tar -xzf standalone.tgz -C ci-runtime
          docker build -f Dockerfile.ci --build-arg GIT_SHA="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "tms-ci:$GITHUB_SHA" ci-runtime
      - name: Conferir Sharp e saude com PostgreSQL real
        run: |
          set -euo pipefail
          docker run --rm "tms-ci:$GITHUB_SHA" node -e \
            'require("sharp")({create:{width:1,height:1,channels:3,background:"#fff"}}).png().toBuffer().then(b=>{if(!b.length)process.exit(1)})'
          docker run -d --name tms-ci --network host \
            -e 'DATABASE_URL=postgresql://tms:tms@127.0.0.1:5432/tms_test?schema=public' \
            "tms-ci:$GITHUB_SHA"
          for _ in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/tms-health.json; then break; fi
            sleep 0.5
          done
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/tms-health.json","utf8"));if(d.status!=="ok"||d.commit!==process.env.GITHUB_SHA)process.exit(1)'
      - name: Autenticar no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar somente na branch padrao
        id: publish
        if: env.PUBLISH == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" != pull_request* ]]
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "tms-ci:$GITHUB_SHA" "$image_name:sha-$GITHUB_SHA"
          docker push "$image_name:sha-$GITHUB_SHA"
          published=$(docker image inspect "$image_name:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          [[ "$published" =~ ^ghcr\.io/avilaops/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$published" >> "$GITHUB_OUTPUT"
      - name: Logs e limpeza do container de teste
        if: always()
        run: |
          docker logs tms-ci 2>&1 || true
          docker rm -f tms-ci >/dev/null 2>&1 || true

  deploy:
    name: deploy
    needs: image
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production-tms.avilaops.com
      cancel-in-progress: false
    steps:
      - name: Enviar imagem ao servidor
        env:
          APPLICATION: tms.avilaops.com
          IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_PORT: 22
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/avilaops/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT > 0 && DEPLOY_PORT < 65536 ))
          temporary_ssh=$(mktemp -d)
          trap 'rm -rf "$temporary_ssh"' EXIT
          chmod 700 "$temporary_ssh"
          printf '%s\n' "$SSH_KEY" > "$temporary_ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$temporary_ssh/known_hosts"
          chmod 600 "$temporary_ssh/key" "$temporary_ssh/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -i "$temporary_ssh/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$temporary_ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $APPLICATION $IMAGE"
