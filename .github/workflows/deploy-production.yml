name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Testes do rastreio publico exigem Postgres: a rota faz o cruzamento
  # CNPJ + codigo no banco, e e exatamente isso que precisa ser provado.
  # Sem este job, `npm test` nunca rodaria fora da maquina de quem escreveu.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mello
          POSTGRES_PASSWORD: mello
          POSTGRES_DB: mello_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mello:mello@127.0.0.1:5432/mello_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma db push --schema=prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test

  # `image` depende de `checks` para que teste vermelho barre a publicacao da
  # imagem e, por tabela, o deploy: `deploy` precisa de `image`. Sem isto o job
  # de teste seria decorativo — o deploy sairia igual com a suite quebrada.
  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra/.github/workflows/container.yml@5e560f44062c8e025ddcfd86197e5394b562deae
    with:
      context: .
      dockerfile: Dockerfile
      image-suffix: ''
      publish: ${{ github.event_name != 'pull_request' }}
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: avilaops/infra/.github/workflows/deploy-ssh.yml@5e560f44062c8e025ddcfd86197e5394b562deae
    with:
      application: mellotransportesriopreto.com.br
      image: ${{ needs.image.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
